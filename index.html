<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>
    GAS接続テスト
  </title>

  <style>

    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background: #f4f6f8;
      text-align: center;
    }

    .box {
      max-width: 600px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
    }

    h1 {
      font-size: 26px;
    }

    #status {
      margin-top: 25px;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 10px;
      background: #eee;
      white-space: pre-line;
    }

    iframe {
      width: 1px;
      height: 1px;
      border: 0;
      position: absolute;
      left: -9999px;
    }

  </style>

</head>

<body>

<div class="box">

  <h1>
    GAS接続テスト
  </h1>

  <p>
    GitHub Pagesから
    出席システムへの接続を確認しています。
  </p>

  <div id="status">
    接続中...
  </div>

</div>


<!--
  GASの橋渡しページを
  見えないiframeとして読み込む
-->

<iframe
  id="gasBridge"

  src="https://script.google.com/a/macros/nodai3.education/s/AKfycbz2wqW8G_pCx30zS1zs8lUDdOHSyuiyTbTPmWqbwtFQ8iFDur2fFOlqdko6NFxV3r9Fyg/exec?page=scannerbridge">
</iframe>


<script>

const status =
  document.getElementById(
    'status'
  );


window.addEventListener(
  'message',
  function(event) {

    /*
      GAS HTML Serviceでは、
      iframe内部の実際の配信元が
      script.google.com以外になる場合があります。

      今回は通信確認だけなので、
      messageのtypeを確認します。
    */

    const data =
      event.data;


    if (
      !data ||
      data.type !==
      'scannerBridgeReady'
    ) {
      return;
    }


    status.textContent =
      '接続成功\nGASと通信できます。';

  }
);


// 10秒経っても応答がない場合
setTimeout(
  function() {

    if (
      status.textContent ===
      '接続中...'
    ) {

      status.textContent =
        '接続を確認できませんでした。\n' +
        'GAS側の認証またはiframeの読み込みを確認します。';

    }

  },
  10000
);

</script>

</body>

</html>
