<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>
    部活動 QR出席スキャナー
  </title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 16px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
    }

    .status {
      padding: 15px;
      margin-bottom: 15px;
      background: white;
      border-radius: 12px;
      text-align: center;
    }

    #count {
      font-size: 34px;
      font-weight: bold;
    }

    #message {
      margin-top: 8px;
      font-size: 18px;
      font-weight: bold;
      white-space: pre-line;
    }

    button {
      width: 100%;
      padding: 17px;
      margin-bottom: 12px;
      border: none;
      border-radius: 10px;
      font-size: 19px;
    }

    #startButton {
      background: #1976d2;
      color: white;
    }

    #finishButton {
      background: #2e7d32;
      color: white;
    }

    #finishButton:disabled {
      opacity: 0.5;
    }

    #clearButton {
      background: #eee;
    }

    #backButton {
      background: #555;
      color: white;
    }

    #reader {
      width: 100%;
      margin-bottom: 15px;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    .listBox {
      background: white;
      border-radius: 12px;
      padding: 15px;
    }

    .listTitle {
      font-weight: bold;
      margin-bottom: 10px;
    }

    #scanList {
      margin: 0;
      padding-left: 25px;
    }

    #scanList li {
      padding: 7px 0;
      font-size: 18px;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>
    部活動 QR出席スキャナー
  </h1>


  <div class="status">

    <div>
      読み取り人数
    </div>

    <div id="count">
      0人
    </div>

    <div id="message">
      「カメラを開始」を押してください。
    </div>

  </div>


  <button
    type="button"
    id="startButton"
    onclick="startScanner()">

    カメラを開始

  </button>


  <div id="reader"></div>

  <button
    type="button"
    id="finishButton"
    onclick="finishScanning()">

  読み取り終了・出席登録へ進む

  </button>

  <button
    type="button"
    id="clearButton"
    onclick="clearScans()">

    読み取り結果をすべて消去

  </button>

  <button
    type="button"
    id="backButton"
    onclick="backToTop()">

    出席管理トップへ戻る

  </button>

  <div class="listBox">

    <div class="listTitle">
      読み取り済み生徒ID
    </div>

    <ol id="scanList"></ol>

  </div>

</div>


<script>

  // ========================
// 一時診断用
// ページ読込方法を表示
// ========================


// ========================
// GASから受け取った
// 一時セッション
// ========================

let scanSessionToken = '';

function loadScanSession() {

  const hash =
    window.location.hash;

  const params =
    new URLSearchParams(
      hash.startsWith('#')
        ? hash.substring(1)
        : hash
    );

  const receivedToken =
    String(
      params.get('session') || ''
    ).trim();


  // GASから新しいセッションを
  // 受け取った場合
  if (receivedToken) {

    scanSessionToken =
      receivedToken;

    // iPadでページが再読み込みされても
    // セッションを失わないよう保存
    sessionStorage.setItem(
      'clubAttendanceScanSession',
      scanSessionToken
    );

    return true;
  }


  // URLにセッションがない場合は
  // 保存済みセッションを確認
  const savedToken =
    String(
      sessionStorage.getItem(
        'clubAttendanceScanSession'
      ) || ''
    ).trim();

  if (savedToken) {

    scanSessionToken =
      savedToken;

    return true;
  }


  scanSessionToken = '';

  return false;
}


const hasScanSession =
  loadScanSession();


// ========================
// QRスキャナー
// ========================

  // ========================
// GAS Webアプリ
// ========================

const GAS_WEB_APP_URL =
  'https://script.google.com/a/macros/nodai3.education/s/AKfycbz2wqW8G_pCx30zS1zs8lUDdOHSyuiyTbTPmWqbwtFQ8iFDur2fFOlqdko6NFxV3r9Fyg/exec';
  
let scanner = null;

let scannerStarted = false;


// 読み取った生徒ID
let scannedStudents = [];


// 同じQRの連続検出防止
let lastDetectedId = '';

let lastDetectedTime = 0;


// ========================
// 保存済みデータを復元
// ========================

function loadSavedScans() {

  try {

    const saved =
      sessionStorage.getItem(
        'clubAttendanceScans'
      );


    if (saved) {

      const parsed =
        JSON.parse(saved);


      if (Array.isArray(parsed)) {

        scannedStudents =
          parsed.filter(
            function(id) {

              return /^N\d{5}$/.test(
                String(id)
              );

            }
          );

      }

    }

  }
  catch (error) {

    scannedStudents = [];

  }


  updateDisplay();
}


// ========================
// 端末内に保存
// ========================

function saveScans() {

  sessionStorage.setItem(
    'clubAttendanceScans',
    JSON.stringify(
      scannedStudents
    )
  );
}


// ========================
// カメラ開始
// ========================

async function startScanner() {

  if (!hasScanSession) {

    document
      .getElementById(
        'message'
      )
      .textContent =
      'GASの出席管理画面から\n' +
      'QRスキャナーを開始してください。';

    document
      .getElementById(
        'startButton'
      )
      .disabled = true;

    return;
  }


  if (scannerStarted) {
    return;
  }


  const button =
    document.getElementById(
      'startButton'
    );

  const message =
    document.getElementById(
      'message'
    );


  button.disabled = true;

  button.textContent =
    'カメラを起動中...';


  try {

    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        '利用可能なカメラがありません。'
      );

    }


    scanner =
      new Html5Qrcode(
        'reader'
      );


    let cameraId =
      cameras[
        cameras.length - 1
      ].id;


    // 背面カメラを探す
    for (
      let i = 0;
      i < cameras.length;
      i++
    ) {

      const label =
        String(
          cameras[i].label || ''
        ).toLowerCase();


      if (
        label.includes('back') ||
        label.includes('rear') ||
        label.includes('environment') ||
        label.includes('背面')
      ) {

        cameraId =
          cameras[i].id;

        break;
      }

    }


    await scanner.start(

      cameraId,

      {

        fps: 15,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.min(
              width,
              height
            ) * 0.65;


          return {

            width:
              Math.floor(size),

            height:
              Math.floor(size)

          };

        }

      },

      onScanSuccess,

      function() {

        // 読み取り失敗時は
        // 何も表示しない

      }

    );


    scannerStarted = true;


    button.style.display =
      'none';


    message.textContent =
      'QRコードを読み取ってください。';

  }

  catch (error) {

    button.disabled = false;

    button.textContent =
      'カメラを開始';


    message.textContent =
      'カメラを開始できませんでした。\n' +
      error.name +
      '\n' +
      error.message;

  }

}


// ========================
// QR読み取り成功
// ========================

function onScanSuccess(
  decodedText
) {

  const id =
    String(
      decodedText || ''
    ).trim();


  // 生徒ID形式ではない
  if (
    !/^N\d{5}$/.test(id)
  ) {

    document
      .getElementById(
        'message'
      )
      .textContent =
      '生徒用QRではありません。';

    return;
  }


  const now =
    Date.now();


  // 同じQRをカメラが連続検出する
  // 現象を防止
  if (
    id === lastDetectedId &&
    now - lastDetectedTime < 2000
  ) {

    return;

  }


  lastDetectedId =
    id;

  lastDetectedTime =
    now;


  // ========================
  // すでに読み取り済み
  // ========================

  if (
    scannedStudents.includes(id)
  ) {

    document
      .getElementById(
        'message'
      )
      .textContent =
      id +
      '\nすでに読み取り済みです。';

    return;
  }


  // ========================
  // 新規読み取り
  // ========================

  scannedStudents.push(
    id
  );


  saveScans();

  updateDisplay();


  document
    .getElementById(
      'message'
    )
    .textContent =
    id +
    '\n読み取りました。';


  // 読み取り成功音
  playBeep();

}


// ========================
// 画面更新
// ========================

function updateDisplay() {

  document
    .getElementById(
      'count'
    )
    .textContent =
    scannedStudents.length +
    '人';


  const list =
    document.getElementById(
      'scanList'
    );


  list.innerHTML = '';


  scannedStudents
    .slice()
    .reverse()
    .forEach(
      function(id) {

        const li =
          document.createElement(
            'li'
          );

        li.textContent =
          id;

        list.appendChild(
          li
        );

      }
    );
}


// ========================
// 読み取り結果消去
// ========================

function finishScanning() {

  if (
    scannedStudents.length === 0
  ) {

    alert(
      'まだQRコードが読み取られていません。'
    );

    return;
  }


  const ok =
    confirm(
      scannedStudents.length +
      '人の読み取りを終了し、\n' +
      '出席登録確認画面へ進みますか？'
    );


  if (!ok) {
    return;
  }


  // ========================
  // GASへ渡すID一覧
  // ========================

  const ids =
    scannedStudents.join(',');


  const url =
    GAS_WEB_APP_URL +
    '?page=batchattendance' +
    '&ids=' +
    encodeURIComponent(ids);


  // ========================
  // そのままGAS確認画面へ移動
  // ========================

  window.location.href =
    url;

}

function backToTop() {

  if (scannedStudents.length > 0) {

    const ok = confirm(
      scannedStudents.length +
      '人の読み取り結果があります。\n\n' +
      '出席登録せずにトップ画面へ戻りますか？'
    );

    if (!ok) return;
  }


  // 読み取り結果を消去
  scannedStudents = [];

  sessionStorage.removeItem(
    'clubAttendanceScans'
  );


  // ========================
  // GitHubタブをその場で閉じる
  // ========================

  window.close();

}
  
function clearScans() {

  if (
    scannedStudents.length === 0
  ) {
    return;
  }


  const ok =
    confirm(
      '読み取り済みの' +
      scannedStudents.length +
      '人をすべて消去しますか？'
    );


  if (!ok) {
    return;
  }


  scannedStudents = [];


  sessionStorage.removeItem(
    'clubAttendanceScans'
  );


  updateDisplay();


  document
    .getElementById(
      'message'
    )
    .textContent =
    '読み取り結果を消去しました。';

}


// ========================
// 簡易成功音
// ========================

function playBeep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    const context =
      new AudioContext();


    const oscillator =
      context.createOscillator();


    const gain =
      context.createGain();


    oscillator.connect(
      gain
    );

    gain.connect(
      context.destination
    );


    oscillator.frequency.value =
      900;


    gain.gain.value =
      0.08;


    oscillator.start();


    oscillator.stop(
      context.currentTime +
      0.08
    );

  }

  catch (error) {

    // 音が鳴らなくても
    // QR読み取りは継続する

  }

}

// ========================
// 初期処理
// ========================

// 新しいQR読み取り開始時は
// 前回の読み取り結果を消去
scannedStudents = [];

sessionStorage.removeItem(
  'clubAttendanceScans'
);

updateDisplay();


if (!hasScanSession) {

  document
    .getElementById(
      'message'
    )
    .textContent =
    'GASの出席管理画面から\n' +
    'QRスキャナーを開始してください。';

  document
    .getElementById(
      'startButton'
    )
    .disabled = true;

}
else {

  document
    .getElementById(
      'message'
    )
    .textContent =
    'カメラを準備しています...';

  setTimeout(
    function() {

      startScanner();

    },
    500
  );

}

</script>

</body>

</html>
